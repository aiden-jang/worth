<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>
    Worth · starters</title
  ><link rel="stylesheet" href="../../../../node_modules/@fontsource/dm-sans/latin-400.css" /><link
    rel="stylesheet"
    href="../../../../node_modules/@fontsource/dm-sans/latin-500.css"
  /><link rel="stylesheet" href="../../../../node_modules/@fontsource/dm-sans/latin-600.css" /><link
    rel="stylesheet"
    href="../../../../node_modules/@fontsource/dm-sans/latin-700.css"
  /><link rel="stylesheet" href="../../../../node_modules/@fontsource/dm-mono/latin-400.css" /><link
    rel="stylesheet"
    href="../../../../src/styles.css"
  /><link rel="stylesheet" href="../../../../src/product.css" /><link
    rel="stylesheet"
    href="../../../../src/cabinet.css"
  /><link rel="stylesheet" href="../../../../src/details.css" /><link
    rel="stylesheet"
    href="../../../../src/cabinet-edition.css"
  />
  <body>
    <div class="app-shell app-shell-dark">
      <aside class="app-rail">
        <a class="brand">worth</a><button class="mobile-menu-toggle icon-button">☰</button>
        <nav class="main-nav">
          <a class="">Archive</a><a class="active">Collections</a><a class="">Activity</a
          ><a class="">Patterns</a><a class="">Search</a>
        </nav>
        <nav class="rail-collections">
          <p>Collections</p>
          <a>Drinks <small>8</small></a
          ><a>Movies <small>1</small></a
          ><a>Places <small>1</small></a>
        </nav>
        <div class="rail-actions">
          <button class="button header-add">Add something +</button
          ><a class="account-link"
            ><span class="account-avatar">P</span
            ><span>Preview archive<small>Account settings ↗</small></span></a
          >
        </div>
      </aside>
      <div class="app-content">
        <main class="light-page lists-page page-width">
          <div class="page-head">
            <div>
              <p class="overline">YOUR ARCHIVE</p>
              <h1>Collections</h1>
              <p>The good, the meh, and the “not again.”</p>
            </div>
            <div class="list-page-actions">
              <button class="button button-accent">+ New collection</button>
            </div>
          </div>
          <section class="list-suggestions">
            <p class="overline">NO COLLECTIONS YET</p>
            <p class="starter-intro">An empty archive. Enjoy it while it lasts.</p>
            <div>
              <button class="starter-card cabinet-starter-card">
                <div class="cabinet-directory-picture">
                  <div class="collection-artwork">
                    <img src="../../../../public/art/starter-covers/drinks-v2.svg" alt="" />
                  </div>
                </div>
                <span class="starter-card-copy"><strong>Drinks</strong><small>collection</small></span
                ><svg width="18" height="18" viewBox="0 0 18 18" stroke="currentColor">
                  <path d="M9 3v12M3 9h12" />
                </svg></button
              ><button class="starter-card cabinet-starter-card">
                <div class="cabinet-directory-picture">
                  <div class="collection-artwork">
                    <img src="../../../../public/art/starter-covers/movies-v2.svg" alt="" />
                  </div>
                </div>
                <span class="starter-card-copy"><strong>Movies</strong><small>collection</small></span
                ><svg width="18" height="18" viewBox="0 0 18 18" stroke="currentColor">
                  <path d="M9 3v12M3 9h12" />
                </svg></button
              ><button class="starter-card cabinet-starter-card">
                <div class="cabinet-directory-picture">
                  <div class="collection-artwork">
                    <img src="../../../../public/art/starter-covers/places-v2.svg" alt="" />
                  </div>
                </div>
                <span class="starter-card-copy"><strong>Places</strong><small>collection</small></span
                ><svg width="18" height="18" viewBox="0 0 18 18" stroke="currentColor">
                  <path d="M9 3v12M3 9h12" />
                </svg></button
              ><button class="starter-card cabinet-starter-card">
                <div class="cabinet-directory-picture">
                  <div class="collection-artwork">
                    <img src="../../../../public/art/starter-covers/cars-v2.svg" alt="" />
                  </div>
                </div>
                <span class="starter-card-copy"><strong>Cars</strong><small>collection</small></span
                ><svg width="18" height="18" viewBox="0 0 18 18" stroke="currentColor">
                  <path d="M9 3v12M3 9h12" />
                </svg></button
              ><button class="starter-card cabinet-starter-card">
                <div class="cabinet-directory-picture">
                  <div class="collection-artwork cabinet-monogram" data-tone="sage">
                    <span class="monogram-sheet"></span><span class="monogram-letter">B</span
                    ><span class="monogram-orbit"></span>
                  </div>
                </div>
                <span class="starter-card-copy"><strong>Books</strong><small>collection</small></span
                ><svg width="18" height="18" viewBox="0 0 18 18" stroke="currentColor">
                  <path d="M9 3v12M3 9h12" />
                </svg></button
              ><button class="starter-card cabinet-starter-card">
                <div class="cabinet-directory-picture">
                  <div class="collection-artwork cabinet-monogram" data-tone="sage">
                    <span class="monogram-sheet"></span><span class="monogram-letter">M</span
                    ><span class="monogram-orbit"></span>
                  </div>
                </div>
                <span class="starter-card-copy"><strong>Music</strong><small>collection</small></span
                ><svg width="18" height="18" viewBox="0 0 18 18" stroke="currentColor">
                  <path d="M9 3v12M3 9h12" />
                </svg></button
              ><button class="starter-card cabinet-starter-card">
                <div class="cabinet-directory-picture">
                  <div class="collection-artwork cabinet-monogram" data-tone="sage">
                    <span class="monogram-sheet"></span><span class="monogram-letter">G</span
                    ><span class="monogram-orbit"></span>
                  </div>
                </div>
                <span class="starter-card-copy"><strong>Games</strong><small>collection</small></span
                ><svg width="18" height="18" viewBox="0 0 18 18" stroke="currentColor">
                  <path d="M9 3v12M3 9h12" />
                </svg>
              </button>
            </div>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
