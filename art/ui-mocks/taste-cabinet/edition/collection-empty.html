<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>
    Worth · collection-empty</title
  ><link rel="stylesheet" href="../../../../node_modules/@fontsource/dm-sans/latin-400.css" /><link
    rel="stylesheet"
    href="../../../../node_modules/@fontsource/dm-sans/latin-500.css"
  /><link rel="stylesheet" href="../../../../node_modules/@fontsource/dm-sans/latin-600.css" /><link
    rel="stylesheet"
    href="../../../../node_modules/@fontsource/dm-sans/latin-700.css"
  /><link rel="stylesheet" href="../../../../node_modules/@fontsource/dm-mono/latin-400.css" /><link
    rel="stylesheet"
    href="../../../../src/styles.css"
  /><link rel="stylesheet" href="../../../../src/product.css" /><link
    rel="stylesheet"
    href="../../../../src/cabinet.css"
  /><link rel="stylesheet" href="../../../../src/details.css" /><link
    rel="stylesheet"
    href="../../../../src/cabinet-edition.css"
  />
  <body>
    <div class="app-shell app-shell-dark">
      <aside class="app-rail">
        <a class="brand">worth</a><button class="mobile-menu-toggle icon-button">☰</button>
        <nav class="main-nav">
          <a class="">Archive</a><a class="active">Collections</a><a class="">Activity</a
          ><a class="">Patterns</a><a class="">Search</a>
        </nav>
        <nav class="rail-collections">
          <p>Collections</p>
          <a>Drinks <small>8</small></a
          ><a>Movies <small>1</small></a
          ><a>Places <small>1</small></a>
        </nav>
        <div class="rail-actions">
          <button class="button header-add">Add something +</button
          ><a class="account-link"
            ><span class="account-avatar">P</span
            ><span>Preview archive<small>Account settings ↗</small></span></a
          >
        </div>
      </aside>
      <div class="app-content">
        <main class="light-page list-page page-width collection-list-page">
          <a class="back-link">← Collections</a>
          <section class="list-page-head">
            <div>
              <p class="overline">YOUR COLLECTION</p>
              <h1>Drinks</h1>
              <p class="list-record-count">0 items</p>
            </div>
            <div class="list-head-actions">
              <a class="button button-outline">Show list</a
              ><button class="button button-outline">Share</button><button class="icon-button">⚙</button>
            </div>
          </section>
          <section class="collection-workspace">
            <div class="cabinet-collection-body cabinet-collection-empty">
              <div class="cabinet-collection-main">
                <form class="collection-capture">
                  <label><input placeholder="What did you try?" /></label
                  ><button class="collection-capture-submit" disabled>Keep it →</button>
                  <div class="collection-capture-note">
                    <button>Add several</button>
                    <p>Rank later. No rush.</p>
                  </div>
                </form>
                <div class="collection-empty-composition">
                  <svg
                    class="collection-empty-illustration"
                    viewBox="0 0 180 156"
                    fill="none"
                    aria-hidden="true"
                  >
                    <g stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
                      <rect
                        x="38"
                        y="23"
                        width="93"
                        height="118"
                        rx="12"
                        transform="rotate(-12 38 23)"
                        fill="var(--blank-back, #292a23)"
                      />
                      <rect
                        x="43"
                        y="13"
                        width="93"
                        height="118"
                        rx="12"
                        transform="rotate(7 43 13)"
                        fill="#eae5d5"
                        stroke="#cbc9b8"
                      />
                      <path d="m63 44 50 6m-52 11 32 4" stroke="#aaa99b" />
                      <path d="m65 88 22 3" stroke="#67695b" />
                    </g>
                    <path d="M145 32v16m-8-8h16" stroke="#e8dc9d" stroke-width="1.5" stroke-linecap="round" />
                  </svg>
                  <div>
                    <h2>Nothing to judge. Yet.</h2>
                    <p>Add the first thing you tried. A name will do.</p>
                    <button class="button button-outline">Add a name →</button>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
