name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Keep releases serialized, while superseded pull-request checks stop promptly.
concurrency:
  group: worth-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:core
      - uses: actions/upload-artifact@v7
        with:
          name: worth-build
          path: dist/
          retention-days: 3
          if-no-files-found: error

  browser_tests:
    name: Browser shard ${{ matrix.shard }} / 2
    needs: check
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: worth-build
          path: dist/
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run e2e --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: worth-browser-failure-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    needs: [check, browser_tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: deploy-worth
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: worth-build
          path: dist/
      - name: Verify Cloudflare deployment credentials
        run: test -n "$CLOUDFLARE_API_TOKEN"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: pnpm run release:built
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify live release
        run: pnpm run verify:live
