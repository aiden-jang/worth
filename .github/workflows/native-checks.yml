name: Native companions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/native-checks.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native-checks.yml']

permissions:
  contents: read

concurrency:
  group: worth-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: native/ios/check-contract.sh
      - name: Prepare pinned XcodeGen
        shell: bash
        run: |
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" generate --spec native/ios/project.yml
      - name: Build app and widget extension without signing
        run: >-
          xcodebuild -project native/ios/WorthCompanion.xcodeproj -scheme WorthCompanion
          -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/worth-ios"
          CODE_SIGNING_ALLOWED=NO build

  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            native/android/**/*.gradle
            native/android/gradle/wrapper/gradle-wrapper.properties
      - name: Use runner Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint and assemble Android companion
        working-directory: native/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-check-reports
          path: native/android/app/build/reports/
          retention-days: 7
