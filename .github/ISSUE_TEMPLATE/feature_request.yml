name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested behavior
      description: Describe how it would help without requiring more work to keep a simple record.
