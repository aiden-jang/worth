name: WorthCompanion
options:
  bundleIdPrefix: com.aidenjang.worth
  deploymentTarget:
    iOS: '17.0'
settings:
  SWIFT_VERSION: '5.0'
  CURRENT_PROJECT_VERSION: '1'
  MARKETING_VERSION: '0.1.0'
  CODE_SIGN_STYLE: Automatic
  TARGETED_DEVICE_FAMILY: '1,2'
  GENERATE_INFOPLIST_FILE: NO
targets:
  WorthCompanion:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aidenjang.worth
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: Worth
        WidgetKeychainGroup: $(AppIdentifierPrefix)com.aidenjang.worth.widgets
        CFBundleURLTypes:
          - CFBundleURLName: com.aidenjang.worth
            CFBundleURLSchemes: [com.aidenjang.worth]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          [
            UIInterfaceOrientationPortrait,
            UIInterfaceOrientationLandscapeLeft,
            UIInterfaceOrientationLandscapeRight,
          ]
    entitlements:
      path: Generated/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.aidenjang.worth]
        keychain-access-groups: [$(AppIdentifierPrefix)com.aidenjang.worth.widgets]
    dependencies:
      - target: WorthWidgets
        embed: true
  WorthWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aidenjang.worth.widgets
      APPLICATION_EXTENSION_API_ONLY: YES
      SKIP_INSTALL: YES
    info:
      path: Generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: Worth widgets
        WidgetKeychainGroup: $(AppIdentifierPrefix)com.aidenjang.worth.widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.aidenjang.worth]
        keychain-access-groups: [$(AppIdentifierPrefix)com.aidenjang.worth.widgets]
